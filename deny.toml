[advisories]
yanked = "deny"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
confidence-threshold = 0.8
allow = ["Apache-2.0", "MIT", "Zlib"]
private = { ignore = true }

# cargo-deny evaluates public package metadata and cannot inspect a confidential
# commercial-authorization instrument. Ariadnion-xtask validates only the
# configured authorization declaration, repository, revision, package set,
# scope, and public status notice. No public-license exception is granted here.

[sources]
unknown-registry = "deny"
unknown-git = "deny"
