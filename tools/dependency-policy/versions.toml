schema_version = 1
rust = "1.95.0"

[core]
abi = "rust-1.0.0/wit-1"

[licenses]
allowed = ["Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "CDLA-Permissive-2.0", "ISC", "MIT", "Unicode-3.0", "Unlicense", "Zlib"]
allowed_exceptions = ["LLVM-exception"]
forbidden = ["GPL-2.0-only", "GPL-2.0-or-later", "GPL-3.0-only", "GPL-3.0-or-later", "AGPL-3.0-only", "AGPL-3.0-or-later"]

[rnmdb_ahcl_dependency]
selected_license = "LicenseRef-AHCL-1.0"
license_copy = "AHCL/AHCL-1.0.md"
additional_restrictions = "none"
repository = "https://github.com/czxieddan/RNovModularDB.git"
commit = "f20040a127a56ec8c37b3398283df36f024a1dd2"
package_prefix = "rnmdb-"
packages = ["rnmdb-common", "rnmdb-types", "rnmdb-sql", "rnmdb-planner", "rnmdb-executor", "rnmdb-txn", "rnmdb-index", "rnmdb-fts", "rnmdb-catalog", "rnmdb-storage", "rnmdb-udf", "rnmdb-security", "rnmdb-instance", "rnmdb-server", "rnmdb-cli"]

[versions]
bytes = "1.12.1"
cap-fs-ext = "4.0.3"
cap-std = "4.0.3"
ctrlc = "3.5.2"
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.4"
hyper = "1.11.0"
hyper-util = "0.1.20"
rustls = "0.23.41"
sha2 = "0.10.9"
tokio = "1.52.3"
tokio-rustls = "0.26.4"
webpki-roots = "1.0.8"
