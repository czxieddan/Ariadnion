[package]
name = "ariadnion-routing-coordinator"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
license = "LicenseRef-AHCL-1.1"
description = "Deterministic account routing and coupled admission coordination."
publish = false

[workspace]

[dependencies]
ariadnion-account-affinity = { path = "../ariadnion-account-affinity" }
ariadnion-account-budget = { path = "../ariadnion-account-budget" }
ariadnion-account-circuit = { path = "../ariadnion-account-circuit" }
ariadnion-account-domain = { path = "../ariadnion-account-domain" }
ariadnion-account-health = { path = "../ariadnion-account-health" }
ariadnion-account-pool = { path = "../ariadnion-account-pool" }
ariadnion-account-proxy = { path = "../ariadnion-account-proxy" }
ariadnion-account-quota = { path = "../ariadnion-account-quota" }
ariadnion-account-schedule = { path = "../ariadnion-account-schedule" }
ariadnion-core = { path = "../../ariadnion-core" }
ariadnion-model-catalog = { path = "../ariadnion-model-catalog" }
ariadnion-model-domain = { path = "../ariadnion-model-domain" }
ariadnion-model-pricing = { path = "../ariadnion-model-pricing" }
ariadnion-rate-limit = { path = "../ariadnion-rate-limit" }
ariadnion-routing-admission = { path = "../ariadnion-routing-admission" }
ariadnion-routing-cost = { path = "../ariadnion-routing-cost" }
ariadnion-routing-domain = { path = "../ariadnion-routing-domain" }
ariadnion-routing-failover = { path = "../ariadnion-routing-failover" }
ariadnion-routing-policy = { path = "../ariadnion-routing-policy" }
ariadnion-routing-usage = { path = "../ariadnion-routing-usage" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
