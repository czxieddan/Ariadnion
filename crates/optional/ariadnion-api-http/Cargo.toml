[package]
name = "ariadnion-api-http"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
license = "LicenseRef-AHCL-1.0"
publish = false

[workspace]

[dependencies]
ariadnion-api-admin = { path = "../ariadnion-api-admin" }
ariadnion-api-dispatch = { path = "../ariadnion-api-dispatch" }
ariadnion-api-domain = { path = "../ariadnion-api-domain" }
ariadnion-api-files = { path = "../ariadnion-api-files" }
ariadnion-core = { path = "../../ariadnion-core" }
ariadnion-principal-binding = { path = "../ariadnion-principal-binding" }
ariadnion-rbac = { path = "../ariadnion-rbac" }
ariadnion-user-domain = { path = "../ariadnion-user-domain" }
axum = { version = "=0.8.9", default-features = false, features = ["json"] }
base64 = { version = "=0.22.1", default-features = false, features = ["alloc"] }
bytes = "=1.12.1"
futures-core = "=0.3.33"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
tokio = { version = "=1.52.3", default-features = false, features = ["rt", "sync", "time"] }
zeroize = { version = "=1.9.0", features = ["alloc"] }

[dev-dependencies]
ariadnion-organization = { path = "../ariadnion-organization" }
tokio = { version = "=1.52.3", default-features = false, features = ["macros", "rt-multi-thread", "sync", "time"] }
tower = { version = "=0.5.3", default-features = false, features = ["util"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
