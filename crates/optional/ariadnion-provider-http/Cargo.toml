[package]
name = "ariadnion-provider-http"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
license = "LicenseRef-AHCL-1.0"
publish = false

[workspace]

[dependencies]
ariadnion-core = { path = "../../ariadnion-core" }
ariadnion-provider-sdk = { path = "../ariadnion-provider-sdk" }
bytes = "=1.12.1"
http = "=1.5.0"
http-body = "=1.1.0"
http-body-util = "=0.1.4"
hyper = { version = "=1.11.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "=0.1.20", default-features = false, features = ["tokio"] }
rustls = { version = "=0.23.41", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "=1.52.3", default-features = false, features = ["io-util", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "=0.26.4", default-features = false }
webpki-roots = "=1.0.8"

[dev-dependencies]
tokio = { version = "=1.52.3", default-features = false, features = ["macros", "rt-multi-thread", "sync", "time"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
